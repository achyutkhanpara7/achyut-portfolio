<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
:root{--l3:#fdf9f2;--l2:#faf1e0;--l1:#f5e6c8;--g1:rgba(233,178,80,.42);--g2:rgba(150,170,255,.28);--ink:#1b2240;--ink-rgb:27,34,64;--line:rgba(27,34,64,.055);--acc:#a86a12;--soft:#faf1e0}

.chart{position:absolute;left:24px;right:24px;bottom:70px;height:360px;display:flex;align-items:flex-end;gap:14px}
.col{flex:1;position:relative;height:100%}
.b{position:absolute;left:0;right:0;border-radius:10px}
.v{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:800}
.lab{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:14px;font-weight:800;color:rgba(27,34,64,.6)}
.big{display:flex;gap:26px;margin-top:6px}

.yr .on{background:#1b2240;color:#fff}
.tol{margin-top:20px;padding:20px;border-radius:18px;box-shadow:inset 0 0 0 2px #d6e0f5;background:#f7f9ff}
.tol b{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.tol .ck{width:32px;height:32px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:17px}
.var{margin-top:18px}.var b{font-size:44px;font-weight:800;letter-spacing:-.04em}
.meter{margin-top:auto;height:12px;border-radius:999px;background:#eee4d0;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#1b2240}
.band{position:absolute;top:-6px;bottom:-6px;left:10%;right:10%;border-radius:8px;background:rgba(22,163,74,.15)}
</style></head><body><div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
