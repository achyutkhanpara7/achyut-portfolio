<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
:root{--l3:#fff7f7;--l2:#fdeced;--l1:#fbdcde;--g1:rgba(240,80,91,.42);--g2:rgba(255,170,120,.32);--ink:#3a1016;--ink-rgb:58,16,22;--line:rgba(58,16,22,.055);--acc:#d92d3a;--soft:#fdeced}
.doc{left:30px;top:92px;width:340px;height:530px;padding:28px}
.doc h4{font-size:22px;line-height:1.2;font-weight:800;margin:14px 0 4px}
.doc small{font-size:15px;font-weight:700;color:rgba(58,16,22,.5)}
.ic{width:56px;height:68px;border-radius:8px;background:linear-gradient(160deg,#f0505b,#b3121f);position:relative}
.ic:after{content:"PDF";position:absolute;bottom:8px;left:9px;color:#fff;font-size:11px;font-weight:800}
.ln{height:13px;border-radius:7px;background:#f1e7e8;margin-top:16px;transition:none}
.ln.hl{background:#ffd0d3}
.scan{position:absolute;left:14px;right:14px;height:5px;border-radius:4px;background:#d92d3a;box-shadow:0 0 24px 6px rgba(217,45,58,.35)}
.list{left:400px;top:92px;width:670px;height:530px;padding:24px}
.row{display:flex;align-items:center;gap:14px;height:100px;padding:0 18px;margin-top:14px;border-radius:14px;background:#fff7f7}
.row .t{flex:1}
.row .t b{display:block;height:13px;border-radius:6px;background:#ecd9db}
.row .t b+b{margin-top:9px;width:60%}
.fw{font-size:16px;font-weight:800;padding:8px 12px;border-radius:8px;background:#fff;color:#7a2a33;box-shadow:inset 0 0 0 1px #f3d6d9}
.st{min-width:160px;justify-content:center}
.ok{background:#dcf5e7;color:#0f7a43}.ok .dot{background:#16a34a}
.pa{background:#fff1d6;color:#9a5b00}.pa .dot{background:#f59e0b}
.gp{background:#ffe1e3;color:#b3121f}.gp .dot{background:#e5484d}
.score{right:-40px;bottom:-56px;width:350px;height:170px;padding:20px 22px;display:flex;align-items:center;gap:18px}
.ring{width:120px;height:120px}
.ring circle{fill:none;stroke-width:12}
.gaps{left:240px;bottom:-40px;padding:16px 22px;display:flex;align-items:center;gap:12px}
.drawer{right:22px;top:150px;width:380px;padding:24px;z-index:5}
.drawer h5{font-size:21px;font-weight:800;margin:10px 0 6px}
.drawer p{font-size:16px;font-weight:600;line-height:1.45;color:rgba(58,16,22,.7)}
.btn{display:inline-flex;margin-top:16px;padding:12px 20px;border-radius:999px;background:#d92d3a;color:#fff;font-size:16px;font-weight:800}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<div class="win" id="win" style="left:90px;top:56px;width:1100px;height:660px">
  <div class="bar"><i></i><i></i><i></i><b>GRC Platform</b><em>AI ALIGNMENT ENGINE</em></div>
  <div class="card doc" id="doc">
    <div class="ic"></div>
    <h4>Information Security Policy</h4><small>Policy binder · 42 pages</small>
    <div id="lines"></div>
    <div class="scan" id="scan" style="top:190px"></div>
  </div>
  <div class="card list" id="list">
    <div class="k">Extracted obligations</div>
    <div id="rows"></div>
  </div>
  <div class="card drawer" id="drawer">
    <span class="pill gp"><i class="dot"></i>Gap</span>
    <h5>No owner for access reviews</h5>
    <p>Quarterly access reviews are required by SOC 2 CC6.2, but no control in the binder covers them.</p>
    <span class="btn">Assign owner</span>
  </div>
  <div class="card gaps" id="gaps"><span class="pill gp" style="font-size:20px"><i class="dot"></i><span id="gn">0</span> gaps identified</span></div>
  <div class="card score" id="score">
    <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke="#fbdcde"/><circle id="arc" cx="50" cy="50" r="42" stroke="#d92d3a" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/></svg>
    <div><div class="k">Compliance score</div><div class="num" style="font-size:58px;margin-top:6px"><span id="sc">0</span>%</div></div>
  </div>
</div>
<svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15 L12 23 L15.5 21.5 L11.5 13.5 L18 13.5 Z" fill="#fff" stroke="#1a1420" stroke-width="1.6" stroke-linejoin="round"/></svg>
<script src="lib.js"></script><script>
const L=document.getElementById('lines');[92,80,96,70,88,60,94,76,84,66,90,72].forEach(w=>{const d=document.createElement('div');d.className='ln';d.style.width=w+'%';L.appendChild(d)});
const R=document.getElementById('rows');
[['SOC 2','ok','Strong match'],['ISO 27001','pa','Partial'],['NIST CSF','gp','Gap'],['PCI DSS','ok','Strong match']].forEach(([f,c,s])=>{
 R.insertAdjacentHTML('beforeend',`<div class="row"><div class="t"><b></b><b></b></div><span class="fw">${f}</span><span class="pill st ${c}"><i class="dot"></i>${s}</span></div>`)});
// window in / out
tw('#win',0,0.7,{opacity:[0,1],y:[24,0],scale:[.97,1]});
tw('#win',9.35,0.6,{opacity:[1,0],y:[0,-14]},'inout');
tw('#doc',0.35,0.6,{opacity:[0,1],x:[-30,0]});
tw('#list',0.55,0.6,{opacity:[0,1],x:[30,0]});
// scan across the document; lines light up as it passes
tw('#scan',0.9,1.7,{opacity:[0,1]},'lin'); tw('#scan',0.9,1.7,{y:[0,300]},'inout'); tw('#scan',2.6,0.3,{opacity:[1,0]});
document.querySelectorAll('.ln').forEach((l,i)=>fn(1.0+i*0.1,0.01,p=>l.classList.toggle('hl',p>0 && i%3!==1)));
// rows fly in from the document
stagger('.row',2.2,0.18,0.55,{opacity:[0,1],x:[-80,0],scale:[.96,1]},'back');
stagger('.row .st',3.6,0.22,0.4,{opacity:[0,1],scale:[.6,1]},'back');
// score + gaps
tw('#score',5.0,0.6,{opacity:[0,1],y:[30,0]},'back');
fn(5.3,1.4,p=>{document.getElementById('arc').style.strokeDashoffset=264-264*0.59*p;document.getElementById('sc').textContent=Math.round(59*p)});
tw('#gaps',5.6,0.55,{opacity:[0,1],y:[30,0]},'back');
count(document.getElementById('gn'),0,4,5.7,0.8);
// cursor clicks the gap row → drawer
tw('#cur',6.6,0.01,{opacity:[0,1]});
tw('#cur',6.6,0.9,{x:[1180,1000],y:[760,500]},'inout');
tw('#cur',7.55,0.12,{scale:[1,.82]}); tw('#cur',7.67,0.15,{scale:[.82,1]});
tw(document.querySelectorAll('.row')[2],7.6,0.3,{scale:[1,1.02]});
fn(7.6,0.01,p=>document.querySelectorAll('.row')[2].style.boxShadow=p>0?'inset 0 0 0 2px #e5484d':'none');
tw('#drawer',7.75,0.55,{opacity:[0,1],x:[60,0]},'back');
tw('#cur',8.6,0.5,{x:[1000,1060],y:[500,430]},'inout');
tw('#cur',9.2,0.3,{opacity:[1,0]});
</script></body></html>
