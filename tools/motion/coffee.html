<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>

.mc{right:-36px;bottom:-44px;width:380px;padding:20px}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:12px}
.hist i{flex:1;border-radius:6px 6px 2px 2px;background:#c98a4a}
